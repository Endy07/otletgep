<!doctype html>
<!-- A linkelőnézet képének forrása (elonezet.png, 1200×630). Újragenerálás: nyisd meg
     http://localhost/Ujjatek/kozos-otletgep/eszkozok/elonezet.html 1200×630-as ablakban, és fényképezd le a .card elemet. -->
<html lang="hu"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@600;800&display=swap">
<style>
  body{margin:0;background:#E8EBF5}
  .card{width:1200px;height:630px;box-sizing:border-box;background:#E8EBF5;padding:54px 64px;display:grid;grid-template-rows:auto 1fr auto;gap:28px;font-family:"Figtree",sans-serif;color:#1B1830}
  h1{font-family:"Bungee",Impact,sans-serif;font-weight:400;font-size:76px;line-height:1;margin:0}
  h1 span{color:#FF4D2E}
  .machine{background:#FF4D2E;border-radius:30px;padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;box-shadow:0 12px 0 #C7321A}
  .reel{background:#fff;border-radius:18px;padding:18px 22px;display:grid;gap:10px;align-content:center}
  .reel small{font-family:"Bungee",sans-serif;color:#FF4D2E;font-size:20px;letter-spacing:.05em}
  .reel b{font-size:40px;line-height:1.1;font-weight:800}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:600}
  .btn{font-family:"Bungee",sans-serif;background:#FFC233;border-radius:999px;padding:12px 30px;box-shadow:0 6px 0 #B98500;font-size:30px}
</style></head>
<body><div class="card">
  <h1>Lehetetlen <span>Helyzet</span> Gép</h1>
  <div class="machine">
    <div class="reel"><small>KIK?</small><b>Három majom</b></div>
    <div class="reel"><small>MIT CSINÁLNAK?</small><b>bombát hatástalanítanak</b></div>
    <div class="reel"><small>HOL?</small><b>egy furgonban</b></div>
  </div>
  <div class="foot"><span>Melyik legyen a következő játékunk? ♥ + pontozás 1–10</span><span class="btn">Pörgetés</span></div>
</div></body></html>
